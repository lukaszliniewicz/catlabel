[project]
name = "catlabel"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
  "fastapi>=0.115.6",
  "python-multipart>=0.0.20",
  "uvicorn>=0.34.0",
  "sqlmodel>=0.0.22",
  "Pillow>=11.1.0",
  "pypdfium2>=4.30.1",
  "bleak>=0.22.3",
  "crc8>=0.2.1",
  "pyserial>=3.5",
  "pyobjc-framework-IOBluetooth>=11.0; sys_platform == 'darwin'",
  "winsdk>=1.0.0b10; sys_platform == 'win32'",
]

[project.optional-dependencies]
ai = ["google-cloud-aiplatform==2.3.0", "litellm==1.103.2"]
headless = ["playwright>=1.40.0"]
mcp = ["mcp==2.3.0", "jsonschema==4.25.1"]
launcher = ["pyinstaller==6.21.0"]

[dependency-groups]
dev = [
  "ruff==0.15.22",
  "basedpyright==1.40.1",
  "vulture==2.16",
  "import-linter==2.15",
  "pip-audit==2.10.1",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py311"
include = ["catlabel/**/*.py", "launcher.py", "tools/**/*.py", "tests/**/*.py", "typings/**/*.pyi"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "C4"]

[tool.basedpyright]
include = ["catlabel", "launcher.py", "tools", "tests", "typings"]
exclude = ["frontend", "docs", ".pixi", "env", "venv", ".venv"]
pythonVersion = "3.11"
typeCheckingMode = "standard"
stubPath = "typings"
strict = [
  "tools/check.py",
  "tools/import_graph.py",
  "tools/sync_dependencies.py",
  "tools/bootstrap_runtime.py",
  "catlabel/services/harness.py",
  "catlabel/services/documents.py",
  "catlabel/services/artifacts.py",
  "catlabel/services/print_jobs.py",
  "catlabel/services/projects.py",
  "catlabel/services/printers.py",
  "catlabel/services/print_executor.py",
  "catlabel/mcp/**/*.py",
  "catlabel/core/paths.py",
  "catlabel/core/release_artifacts.py",
  "catlabel/core/runtime_lease.py",
  "catlabel/core/release_slots.py",
  "tools/build_release.py",
  "tools/probe_release.py",
  "catlabel/core/server_security.py",
  "catlabel/core/async_operations.py",
  "catlabel/services/agent_context.py",
  "catlabel/printing/admission.py",
  "catlabel/devices/bluetooth_profiles.py",
  "catlabel/protocol/family.py",
  "catlabel/protocol/encoding.py",
  "catlabel/protocol/plan.py",
  "catlabel/protocol/packet.py",
  "catlabel/protocol/steps.py",
  "catlabel/protocol/types.py",
  "catlabel/protocol/families/yk_common.py",
  "catlabel/protocol/families/yk_astra_session.py",
  "catlabel/protocol/families/yk_astra_p1.py",
  "catlabel/printing/runtime/yk_astra_p1.py",
  "catlabel/printing/runtime/tiny.py",
  "catlabel/printing/runtime/luck_a41.py",
  "catlabel/printing/runtime/phomemo_released.py",
  "catlabel/protocol/runtime.py",
  "catlabel/transport/bluetooth/classic_receive.py",
  "catlabel/core/resource_limits.py",
  "catlabel/api/request_limits.py",
  "catlabel/rendering/image_payload.py",
  "catlabel/rendering/browser_stream.py",
  "catlabel/services/prepared_prints.py",
  "catlabel/api/routes_prepared_print.py",
  "catlabel/rendering/paper_layout.py",
  "catlabel/services/uploads.py",
  "catlabel/vendors/generic/catalog_snapshot.py",
  "catlabel/protocol/families/niimbot_core.py",
  "catlabel/protocol/families/phomemo_esc_core.py",
  "catlabel/protocol/families/luck_transactions.py",
  "catlabel/protocol/families/printmaster_core.py",
  "catlabel/protocol/families/phomemo_replies.py",
  "catlabel/protocol/families/phomemo_esc.py",
  "catlabel/printing/runtime/printmaster_esc.py",
  "catlabel/vendors/generic/catalog_updates.py",
  "tools/sync_luck_catalog.py",
  "tools/sync_timiniprint_catalog.py",
]

[tool.importlinter]
root_package = "catlabel"
exclude_type_checking_imports = false

[[tool.importlinter.contracts]]
name = "Protocol stays stateless and avoids live printing and transport"
type = "forbidden"
source_modules = ["catlabel.protocol"]
forbidden_modules = ["catlabel.printing", "catlabel.transport"]

[[tool.importlinter.contracts]]
name = "Transport avoids protocol parsing and runtime selection"
type = "forbidden"
source_modules = ["catlabel.transport"]
forbidden_modules = ["catlabel.protocol", "catlabel.printing.runtime"]

[[tool.importlinter.contracts]]
name = "Shared services avoid API and MCP adapters"
type = "forbidden"
source_modules = [
  "catlabel.services.harness",
  "catlabel.services.documents",
  "catlabel.services.artifacts",
  "catlabel.services.print_jobs",
  "catlabel.services.projects",
  "catlabel.services.printers",
  "catlabel.services.print_executor",
]
forbidden_modules = ["catlabel.api", "catlabel.mcp"]

[[tool.importlinter.contracts]]
name = "MCP adapters avoid API route modules"
type = "forbidden"
source_modules = ["catlabel.mcp"]
forbidden_modules = ["catlabel.api"]
