name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11.15'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install uv==0.11.29
      - run: uv pip sync --system --require-hashes requirements-check.lock
      - run: npm install --global npm@11.16.0
      - run: npm ci
        working-directory: frontend
      - name: Linux complete static, test and scratch-build gate
        if: runner.os == 'Linux'
        run: python -m tools.check --lane full --report check-results/static.json
      - name: Native tests and shared checks
        if: runner.os != 'Linux'
        run: python -m tools.check --lane full --without-typing --report check-results/static.json
      - name: Resolved dependency advisory gate
        if: runner.os == 'Linux'
        run: python -m tools.check --lane audit --report check-results/audit.json
      - name: Preserve uncapped diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: checks-${{ matrix.os }}
          path: check-results/
          if-no-files-found: error
